name: Reproduce MyST Unicode image issue
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sphinx: ["9.1.1", "9.2.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "myst-parser==5.1.0" "sphinx==${{ matrix.sphinx }}"
      - name: Show versions
        run: |
          python -m pip show myst-parser Sphinx markdown-it-py
          find docs -type f -print
      - name: Build HTML
        shell: bash
        run: |
          mkdir -p _build
          sphinx-build -E -a -b html docs _build/html 2>&1 | tee _build/sphinx.log
      - name: Verify copied image assets
        run: python scripts/check_output.py _build/html/index.html
      - name: Upload build output and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-${{ matrix.sphinx }}-html-and-log
          path: |
            _build/html/
            _build/sphinx.log
          if-no-files-found: warn
